# Конфигурация PostgreSQL для WAL архивирования
# Добавьте эти параметры в postgresql.conf

# ========================================
# WAL (Write-Ahead Logging) Настройки
# ========================================

# Включить архивирование WAL
archive_mode = on

# Команда для архивирования WAL файлов
# ВАЖНО: Измените путь на ваш реальный путь к директории WAL
archive_command = 'copy "%p" "C:\\Users\\koval\\OneDrive\\Desktop\\RRR\\backups\\wal_archive\\%f"'

# Для Linux используйте:
# archive_command = 'cp "%p" "/path/to/backups/wal_archive/%f"'

# Максимальное время сохранения WAL файлов
max_wal_size = 1GB
min_wal_size = 80MB

# Количество WAL сегментов для сохранения
wal_keep_segments = 32

# ========================================
# Дополнительные настройки для backup
# ========================================

# Включить логирование всех команд
logging_collector = on

# Логировать все подключения
log_connections = on

# Логировать все отключения
log_disconnections = on

# Логировать все SQL команды (только для отладки)
# log_statement = 'all'

# ========================================
# Рекомендации по применению:
# ========================================
#
# 1. Найдите файл postgresql.conf:
#    - Windows: обычно в C:\Program Files\PostgreSQL\<version>\data\
#    - Linux: обычно в /etc/postgresql/<version>/main/
#
# 2. Добавьте или измените указанные выше параметры
#
# 3. Создайте директорию для WAL архивов:
#    mkdir backups\wal_archive
#
# 4. Убедитесь, что пользователь postgres имеет права на запись в эту директорию
#
# 5. Перезапустите PostgreSQL:
#    - Windows: Services -> PostgreSQL -> Restart
#    - Linux: sudo systemctl restart postgresql
#
# 6. Проверьте, что архивирование работает:
#    SELECT pg_switch_wal();
#    Проверьте, что файл появился в директории wal_archive
#

